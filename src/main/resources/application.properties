spring.application.name=inventarios
# conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración el patron del log
logging.pattern.console=[%thread] %-5level: %logger{36} - %msg%n
#configuración del nivel de log (INFO)
logging.level.root=INFO
# Opcional: Configuración del nivel de log para paquetes específicos
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot=WARN
# Cambiar el puerto del servidor tomcat
#server.port=8080
spring.main.banner-mode=off